# Phase 1 gate: rule identification on the case-study description, scored
# against the hand-verified validation games.
#
# Reproducible from this file plus the seed: the description path, the
# clustering resolution and the intervention probe budget are all stated
# here rather than living as defaults in code.

extends: base.yaml

seed: 0

cost:
  # The intervention sweep runs in parallel (#192): each cluster's probe
  # is independent, and results are collected by SUBMISSION index so the
  # report cannot depend on completion order. Serial, the 39 probes at
  # ~134s each take over an hour; this is what the parallelism was for.
  n_workers: 8

identification:
  # The OFFICIAL infix description (issue #190). LGREF refuses prefix.
  gdl: docs/gdl/integrated.gdl
  games: [tictactoe, nim]
  game_dir: lgref/identify/testgames

  # `auto` calibrates the Louvain scale to hold mean clauses-per-rule at
  # the value validated against hand-verified boundaries (tic-tac-toe
  # 6.0, nim 5.2). Louvain resolution is measured against total graph
  # weight, so a constant tuned on a 22-34 clause game is systematically
  # too coarse on a 522-clause one: at 1.0 Royal Chess clustered at 20.3
  # clauses per rule and produced an 80-clause cluster holding the
  # movement rules of every piece. Calibration picks 1.0 on both
  # validation games -- reproducing their scores exactly -- and 33.0 on
  # Royal Chess, where the largest cluster falls from 80 to 14 (#189).
  #
  # A number here pins the resolution instead, for reproducing an
  # earlier run.
  resolution: auto

  probe_plies: 20
  probe_seeds: 10

report_dir: lgref/report
