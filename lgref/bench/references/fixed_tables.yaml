# Fixed tables: rule or language (Paper A, #400).
#
# The user's decision 3 (2026-11-27), option (c): a fixed table is a RULE
# when a legal, goal, terminal (or next) statement reads it, directly or
# through helpers, AND the board geometry does not also use it; otherwise
# it is LANGUAGE. The first half is checked in code
# (lgref.bench.setup.fixed_table_candidates); the second half is a
# judgement per entry, with its reason, because no syntactic test
# separates a game's content from its vocabulary. Written by Claude;
# PROVISIONAL; the user may veto any entry. A POST-FREEZE amendment:
# the frozen reference (kinds.yaml) is kept and reported beside it.
#
# verdict: rule | language.  why: one line.
fixed_tables:
  nim:
    atleast2: {verdict: language, why: "counting arithmetic: \"at least two\" over the pile sizes"}
    positive: {verdict: language, why: "counting arithmetic: \"at least one\""}
    succ: {verdict: language, why: "successor table: arithmetic"}
