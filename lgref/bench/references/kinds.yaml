# Which statements are NOT ablation candidates, per development game
# (Paper A, #358). PROVISIONAL, written by Claude, the method's author;
# not a human annotation.
#
# Three kinds are read from the syntax and need no judgement:
#   role     role(...) declarations
#   init     init(...) facts: the initial position
#   outcome  terminal and goal statements
# One kind needs judgement, and is listed here by head predicate:
#   language board geometry, coordinate and counting arithmetic, and
#            other vocabulary a reader would not call a rule of play
# Everything else is a rule statement: an ablation candidate.
#
# `ambiguous` lists predicates that are fixed tables (no state at any
# depth) but that I read as RULE content, because the table IS the rule
# -- the same case as Royal Chess's boulder_first_dest. A method that
# calls them language is marking a real rule as setup, which is the
# error the user asked to rule out, so they are counted as rules here.
game_kinds:
  tictactoe:
    language: []
    ambiguous: []
  nim:
    language: [succ, positive, atleast2]
    ambiguous: []
  corridor:
    language: [succ, plus2]
    ambiguous: [inside]        # the corridor limit: the boundary rule
  breakthrough5:
    language: [index, forward, beside, opponent]
    ambiguous: [goalrow]       # which row wins: the far-row win rule
  othello4:
    language: [index, succ, delta, shift, step, opponent, after, fewer]
    ambiguous: []
  dropthree:
    language: [below, right]
    ambiguous: []
  montyhall:
    language: [door]
    ambiguous: []
  # ---- TEST set (#373, stage 5), written after the freeze (ab7b33b)
  # and before any method was run on these games. Same conventions,
  # same author (Claude), same provisional status. `ambiguous` again
  # lists fixed tables that are rule content: whether such a table is
  # language is an OPEN decision with the user; moving a predicate
  # between the two lists is the one switch it needs.
  skirmish:
    language: [close, coord, opponent, succ, tsucc]
    ambiguous: [kingstep]
  muddychildren:
    language: [child, yesno]
    ambiguous: [oneMuddy]
  kuhnpoker:
    language: [action, card, opponent, player]
    ambiguous: [higher]
  leducholdem:
    language: [action, card, opponent, player, rank, succ]
    ambiguous: [higher, amount, payoff]
  russiancards:
    language: [addmod, card, lt, player]
    ambiguous: []
  cherylsbirthday:
    language: [listener]
    ambiguous: [date]
  kalah_mini:
    language: [atmost, more, num, opponent, opposite, side, storeof, succ, sum, trio]
    ambiguous: [ring]
  dotsboxes_2x2:
    language: [bounds, box, line, more, opponent, plus2, succ]
    ambiguous: []
  hex_3x3:
    language: [index, opponent, succ, touches]
    ambiguous: [firstedge, lastedge]
  checkers_4x4:
    language: [forward, index, near, opponent, straddle, succ]
    ambiguous: [heading, farrow]
  foxgeese_mini:
    language: [beside, hop, index, orth, straddle, succ, up]
    ambiguous: [waddle]
  chomp_3x3:
    language: [atmost, opponent]
    ambiguous: []
  synth_independent:
    language: [opponent, plus]
    ambiguous: []
  synth_shared:
    language: [opponent, plus]
    ambiguous: []
  synth_redundant:
    language: [opponent, plus]
    ambiguous: []
