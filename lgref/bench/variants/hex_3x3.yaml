# Reference variants and probes for Hex 3x3 (Paper A test set, #373).
#
# WRITTEN BY CLAUDE, the author of the identification method, from the
# game's stated rules, after the freeze (ab7b33b). PROVISIONAL. Chosen
# before any grouping method's grouping of this game was seen.
#
# Hex has few rules that can be changed while it stays a well-formed
# game: removing a link between cells, or the recursive growth of a
# chain, leaves full boards with no winner and no legal move. The one
# change is therefore to the outcome, and it REPLACES statements, which
# deleting a group cannot express (as Nim's last_taker_wins on the dev
# set).
#
# A state lists every fact: cell(x,y,colour), control(player).
game: hex_3x3
author: Claude (claude-opus-5-5), 2026-11-27, issue #373
changes:

  - id: misere
    summary: >-
      Joining your own two edges LOSES instead of winning. Placement,
      alternation and when the game ends are unchanged.
    edits:
      - replace: "goal(P,100) :- joined(P)\n"
        with: "goal(P,0) :- joined(P)\n"
      - replace: "goal(P,0) :- opponent(P,Q) & joined(Q)\n"
        with: "goal(P,100) :- opponent(P,Q) & joined(Q)\n"
    probes:
      - id: a_red_chain_loses
        role: changed
        says: red joining bottom to top loses
        state: control(blue) cell(2,1,red) cell(1,2,red) cell(1,3,red) cell(3,1,blue) cell(3,2,blue)
        expect:
          - terminal: true
          - goal: red 0
          - goal: blue 100
      - id: b_blue_chain_loses
        role: changed
        says: blue joining left to right loses
        state: control(red) cell(1,2,blue) cell(2,2,blue) cell(3,2,blue) cell(1,1,red) cell(2,1,red) cell(3,3,red)
        expect:
          - terminal: true
          - goal: blue 0
      - id: c_ending_unchanged
        role: unchanged
        says: a board with no chain is not over
        state: control(red) cell(1,1,red) cell(2,2,red) cell(2,3,red)
        expect:
          - terminal: false
      - id: d_placement_unchanged
        role: unchanged
        says: a stone may still be placed on any empty cell
        state: control(red) cell(1,1,red) cell(2,2,blue)
        expect:
          - legal: red place(3,3)
          - legal: red place(2,2)
            is: false
