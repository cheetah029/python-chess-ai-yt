# Designer's INTENDED strategic functions for Royal Chess rules.
#
# Development annotations, held out from rule identification (Phase 1)
# and function inference (Phase 2). Read only by Phase 4 evaluation,
# via explicit path. See README.md in this directory.
#
# Status: TEMPLATE — the designer completes this before Phase 4.
# Only `boulder` carries a label so far (from the project brief);
# every other entry is a placeholder to be filled in or removed.
#
# `functions` must draw on the Phase 2 ontology's strategic-function
# vocabulary. Operational properties (state persistence, historical
# dependency, piece transformation) describe HOW a rule works and do
# NOT belong here — this file records what the rule is FOR.

schema_version: 1

rules:

